    <style>
      html,body{background:#04060e;margin:0}
      #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#04060e;transition:opacity .6s ease,visibility .6s ease}
      #boot.done{opacity:0;visibility:hidden}
      #boot .ring{width:74px;height:96px;border:2px solid rgba(217,225,255,.85);border-radius:999px;position:relative;box-shadow:0 0 24px rgba(124,156,255,.25),inset 0 0 18px rgba(124,156,255,.15);animation:bootPulse 1.4s ease-in-out infinite}
      #boot .ring::after{content:"";position:absolute;left:-14px;right:-14px;top:50%;height:2px;background:linear-gradient(90deg,transparent,#f5f7ff,transparent);animation:bootScan 1.4s ease-in-out infinite}
      #boot p{margin-top:22px;font:600 12px/1 system-ui,sans-serif;letter-spacing:.38em;color:#8f98b8;text-align:center}
      @keyframes bootPulse{50%{transform:scale(1.06);box-shadow:0 0 40px rgba(124,156,255,.4),inset 0 0 22px rgba(124,156,255,.25)}}
      @keyframes bootScan{0%{transform:translateY(-34px);opacity:0}50%{opacity:1}100%{transform:translateY(34px);opacity:0}}
      @media (prefers-reduced-motion:reduce){#boot .ring,#boot .ring::after{animation:none}}
    </style>
  </head>
